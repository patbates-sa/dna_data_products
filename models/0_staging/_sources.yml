# Source definitions for the sales project
# This file defines raw advertising data sources

sources:
  - name: ads
    description: Raw advertising data from the ads platform
    database: RAW
    schema: ADS
    tables:
      - name: ad_spend
        description: Raw advertising spend data containing spend amounts per advertiser
        columns:
          - name: id
            description: Unique identifier for the advertiser
          - name: spend
            description: Amount spent on advertising
        config:
          freshness:
            warn_after: {count: 365, period: day}

