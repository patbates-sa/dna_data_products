# Source definitions for the sales project
# This file defines raw advertising data sources
# TODO(SOURCE-ISOLATION): Move sources to a demo-specific sources database so
# each demo instance has its own isolated raw data instead of sharing the 'raw'
# database. When done, also remove the demo_takeout phase6 handling that
# replaces +database for data_science (grep SOURCE-ISOLATION across all repos).

sources:
  - name: ads
    description: Raw advertising data from the ads platform
    database: raw
    schema: ads
    tables:
      - name: ad_spend
        description: Raw advertising spend data containing spend amounts per advertiser
        columns:
          - name: id
            description: Unique identifier for the advertiser
          - name: spend
            description: Amount spent on advertising
        config:
          freshness:
            warn_after: {count: 365, period: day}

