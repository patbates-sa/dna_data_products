# Documentation for int_customer_insights model
# Intermediate customer attributes with derived value ratio

models:
  - name: int_customer_insights
    description: >
      Intermediate customer model built from `stg_dim_customers`.
      It preserves the full customer attribute set and adds `value_quotient`,
      a derived ratio of account balance to lifetime value for downstream analysis.
    columns:
      - name: customer_key
        description: Unique identifier for the customer dimension record.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_customers')
                field: customer_key
      - name: region
        description: Geographic region associated with the customer.
      - name: name
        description: Customer name as provided by the shared domain dimension.
      - name: address
        description: Customer mailing address.
      - name: nation
        description: Country associated with the customer.
      - name: phone_number
        description: Customer phone number.
      - name: account_balance
        description: Current account balance recorded for the customer.
      - name: market_segment
        description: Customer market segment used for commercial analysis.
      - name: lifetime_value
        description: Estimated lifetime value attributed to the customer.
      - name: tier_name
        description: Customer tier classification derived from lifetime value.
      - name: is_high_value
        description: Flag indicating whether the customer is classified as high value.
      - name: is_mid_value
        description: Flag indicating whether the customer is classified as mid value.
      - name: is_low_value
        description: Flag indicating whether the customer is classified as low value.
      - name: value_quotient
        description: >
          Ratio of `account_balance` to `lifetime_value` for the customer.
          This value is null when `lifetime_value` is null or zero.
        data_tests:
          - not_null:
              config:
                where: "lifetime_value is not null"
