# Documentation for ad_spend_per_adv model
# Aggregated advertising spend by advertiser

models:
  - name: dim_ad_spend_per_adv
    description: >
      Aggregated advertising spend by advertiser. This mart provides a single row per advertiser
      with their total advertising spend, enabling analysis of advertiser investment levels
      and identification of top spenders. Includes a user_id assignment for the first advertiser
      to support specific business logic requirements.
    config:
      materialized: table
      group: sales
      contract:
        enforced: true
    columns:
      - name: advertiser_id
        data_type: int
        description: >
          Unique identifier for the advertiser. Primary key for this table,
          inherited from the staging layer.
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_type: int
        description: >
          User identifier associated with the advertiser. Set to 1 for the first advertiser
          by ID ordering, null for all others. Used for specific business logic requirements.
      - name: total_ad_spend
        data_type: int
        description: >
          Sum of all advertising spend for the advertiser. Aggregated from individual
          spend records in the staging layer.
        data_tests:
          - not_null
