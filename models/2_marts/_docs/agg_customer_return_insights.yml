# Documentation for agg_customer_return_insights model
# Reporting mart for customer value measures and return behavior

models:
  - name: agg_customer_return_insights
    description: >
      Reporting mart that summarizes customer insight measures alongside return behavior
      by customer segment. Built from `int_customer_insights` and `agg_customer_returns`,
      this model supports analysis of how account balance, lifetime value, and value quotient
      relate to return order volume and return sales amount across segments.
    columns:
      - name: segment_key
        description: Unique segment identifier composed of region, market segment, and tier name.
        data_tests:
          - unique
          - not_null
      - name: region
        description: Customer region for the reporting segment. Nulls are normalized to `unknown`.
        data_tests:
          - not_null
      - name: market_segment
        description: Customer market segment for the reporting segment. Nulls are normalized to `unknown`.
        data_tests:
          - not_null
      - name: tier_name
        description: Customer tier for the reporting segment. Nulls are normalized to `unclassified`.
        data_tests:
          - not_null
      - name: customer_count
        description: Total number of customers in the segment.
        data_tests:
          - not_null
      - name: returning_customer_count
        description: Number of customers in the segment with at least one returned order.
        data_tests:
          - not_null
      - name: customers_without_returns_count
        description: Number of customers in the segment with no returned orders.
        data_tests:
          - not_null
      - name: pct_customers_with_returns
        description: Share of customers in the segment with at least one returned order.
        data_tests:
          - not_null
      - name: avg_account_balance
        description: Average account balance for customers in the segment.
      - name: avg_lifetime_value
        description: Average lifetime value for customers in the segment.
      - name: avg_value_quotient
        description: Average ratio of account balance to lifetime value for customers in the segment.
      - name: total_return_orders
        description: Total returned-order count across customers in the segment.
        data_tests:
          - not_null
      - name: total_return_sales_amount
        description: Total return sales amount across customers in the segment.
        data_tests:
          - not_null
      - name: avg_return_orders_per_customer
        description: Average returned-order count per customer in the segment.
      - name: avg_return_sales_amount_per_customer
        description: Average return sales amount per customer in the segment.
      - name: avg_return_sales_amount_per_returning_customer
        description: Average return sales amount for customers in the segment who have returns.
      - name: corr_account_balance_to_return_orders
        description: Correlation between account balance and returned-order count within the segment.
      - name: corr_account_balance_to_return_sales_amount
        description: Correlation between account balance and return sales amount within the segment.
      - name: corr_lifetime_value_to_return_orders
        description: Correlation between lifetime value and returned-order count within the segment.
      - name: corr_lifetime_value_to_return_sales_amount
        description: Correlation between lifetime value and return sales amount within the segment.
      - name: corr_value_quotient_to_return_orders
        description: Correlation between value quotient and returned-order count within the segment.
      - name: corr_value_quotient_to_return_sales_amount
        description: Correlation between value quotient and return sales amount within the segment.
