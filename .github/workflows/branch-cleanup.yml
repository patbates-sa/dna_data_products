# =============================================================================
# Branch Cleanup - Caller Workflow
# =============================================================================
# This workflow calls the reusable branch cleanup workflow from the Terraform
# repository to automatically delete stale branches older than 7 days.
#
# Runs daily at 3 AM UTC and can be triggered manually via workflow_dispatch.
#
# Default protected patterns (from reusable workflow):
#   - main, UAT, develop
#   - feat/*, fix/*, hotfix/*, release/*
#
# Note: The UAT branch used by this project for staging is already included
# in the default protected patterns from the reusable workflow.
#
# To add additional protected patterns, set extra_protected_patterns in 'with' block.
# To override the age threshold, use days_old when triggering manually.
# =============================================================================

name: Branch Cleanup

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      days_old:
        description: "Delete branches older than this many days (default: 7)"
        type: number
        default: 7
      dry_run:
        description: "Dry run (only log, do not delete)"
        type: boolean
        default: false

jobs:
  cleanup:
    permissions:
      contents: write
      pull-requests: write
    uses: dbt-labs/sa-demo-terraform/.github/workflows/branch-cleanup.yml@main
    with:
      days_old: ${{ github.event.inputs.days_old && fromJSON(github.event.inputs.days_old) || 7 }}
      # UAT branch is already protected by default in the reusable workflow
      dry_run: ${{ inputs.dry_run || false }}
